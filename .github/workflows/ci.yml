name: Yesbroker devops CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      PORT: 5000
      MONGO_URL: mongodb://localhost:27017/testdb   # code reads MONGO_URL, not MONGO_URI
      JWT_SECRET: ci-test-secret
      # Only if a test really needs them, add as Repository secrets:
      # CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      # CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      # CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

    services:
      mongo:
        image: mongo
        ports:
          - 27017:27017

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"            # mongoose 9 / mongodb 7 need Node 20.19+
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Waiting for MongoDB to be ready
        run: |
          until nc -z localhost 27017; do
            echo "Waiting for MongoDB..."
            sleep 2
          done
          echo "MongoDB is up"

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Running backend test
        working-directory: ./backend
        run: npm test